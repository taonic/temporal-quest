# The course site, its /api and the sandboxes' model passthrough, and the Temporal UI proxy, all
# on 8080. The UI needs an origin of its own: ui.temporalquest.dev (UI_PROXY_PUBLIC_BASE), on
# 443 like the site, so networks that allow only 80 and 443 reach it; the session cookie names
# temporalquest.dev to reach it too. It needs its certificate: course/DEPLOY.md.
# Deploy from the repo root (it's the build context: the image carries the workshop's files):
#
#   fly deploy . --config course/fly.toml --dockerfile course/Dockerfile \
#     --ignorefile course/.dockerignore --ha=false
#
# or `npm run deploy` in course/.
# One machine: the runner keeps the terminals' connections and the rate limits in memory, and
# its SQLite database (users, the allowlist, the activity log) on the volume quest_data.
# Secrets, the volume and the first deploy: course/DEPLOY.md.

app = "temporal-quest"
primary_region = "sjc"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  PUBLIC_URL = "https://temporalquest.dev"
  UI_PROXY_PUBLIC_BASE = "https://ui.temporalquest.dev"
  MAX_SANDBOXES = "100"
  LLM_MODEL = "gemini-3.8-flash"
  DATABASE_PATH = "/data/quest.db"

[mounts]
  source = "quest_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 600

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# Dedicated CPUs, for a Derby: 20 racers each poll their board every 2.5 s (a Daytona command
# apiece) and a shared CPU's burst allowance runs out under that; 4 GB for the terminals' and
# the UI proxy's connections. It stops when idle all the same, so it's paid by the second.
[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 4096
